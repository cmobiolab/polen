name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: |
          python -m build packaging/polen --outdir dist-polen/
          python -m twine check dist-polen/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-polen
          path: dist-polen/

  # o openmm-polen tem workflow e ambiente próprios (publish-openmm-polen.yml / pypi-openmm-polen): o PyPI não aceita a
  # mesma configuração de publicador para dois projetos
  publish-polen:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing (OIDC): no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-polen
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
