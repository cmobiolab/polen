name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: |
          python -m build packaging/polen --outdir dist-polen/
          python -m build packaging/openmm-polen --outdir dist-openmm-polen/
          python -m twine check dist-polen/* dist-openmm-polen/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-polen
          path: dist-polen/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-openmm-polen
          path: dist-openmm-polen/

  # um job (e um ambiente) por projeto: o PyPI não aceita o mesmo publicador pendente
  # (repositório + workflow + ambiente) para dois projetos, e assim um não depende do outro
  publish-polen:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing (OIDC): no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-polen
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-openmm-polen:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-openmm-polen
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-openmm-polen
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
